name: Release

# A version tag (v0.1.0) builds, checks and publishes nullcase-pytest and
# nullcase-sandbox to PyPI via Trusted Publishing.
# Running it manually does everything except publish (a dry run).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/check_versions.py "${REF_NAME#v}"
          else
            python3 scripts/check_versions.py
          fi

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest

      - name: Build
        run: |
          for package in nullcase-pytest nullcase-sandbox; do
            uv build --package "$package" --out-dir dist
          done

      - name: Check distributions
        run: uvx twine check --strict dist/*

      - name: Install wheels in a clean virtualenv and smoke-test them
        run: python scripts/smoke_test_dist.py dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/nullcase-pytest/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

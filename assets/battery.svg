<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">nullcase-battery diagnoses an order-dependent test</title>
<desc id="desc">nullcase-battery re-runs tests/test_order.py::test_first_user_gets_id_1 10 times with every factor pinned and 10 times with the test order shuffled. The pinned runs fail 0 of 10 and the shuffled runs 7 of 10. Their 95% Wilson intervals, [0.00, 0.28] and [0.40, 0.89], don't overlap, so the diagnosis is order_dependent, with a repro command that failed 3 of 3 replays. Recorded on eval/demo-repo on 2026-09-28; paths shortened.</desc>

[project]
name = "nullcase-workspace"
version = "0.0.0"
description = "Workspace root for the NullCase open-core packages"
requires-python = ">=3.11"
dependencies = ["nullcase-pytest"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1",
    "pytest-xdist>=3.8",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.uv.sources]
nullcase-pytest = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["packages"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["-p", "pytester", "--import-mode=importlib"]

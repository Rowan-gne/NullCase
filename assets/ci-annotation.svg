<title id="title">The NullCase Action diagnoses a failing test in CI</title>
<desc id="desc">A GitHub Actions job named 'pytest with NullCase diagnosis' runs on Rowan-gne/nullcase-demo. tests/test_registry.py::test_first_user_gets_id_1 fails, the Action re-runs it under controlled perturbations, and the run gets a warning annotation titled 'NullCase: order_dependent': the test fails when the test order changes; it depends on state other tests leave. Replay of run 36477779154 from 2026-09-28, time compressed.</desc>

[project]
name = "nullcase-pytest"
version = "0.0.0"
description = "pytest plugin that records per-test results for NullCase"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pytest>=8.0"]

[project.entry-points.pytest11]
nullcase = "nullcase_pytest.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

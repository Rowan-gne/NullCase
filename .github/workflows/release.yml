name: Release

# A version tag (v0.1.0) builds, checks and publishes nullcase-pytest,
# nullcase-retrieval and nullcase-sandbox to PyPI via Trusted Publishing.
# Running it manually does everything except publish (a dry run).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Check versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/check_versions.py "${REF_NAME#v}"
          else
            python3 scripts/check_versions.py
          fi

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest

      - name: Build
        run: |
          for package in nullcase-pytest nullcase-retrieval nullcase-sandbox; do
            uv build --package "$package" --out-dir dist
          done

      - name: Check distributions
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nullcase-pytest/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2

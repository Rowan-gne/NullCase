<title id="title">The draft pull request NullCase opened for a flaky test</title>
<desc id="desc">Draft pull request #1 on Rowan-gne/nullcase-demo, 'Fix flaky test_first_user_gets_id_1 (order dependent)', from the branch nullcase-fix/test_first_user_gets_id_1 into main. The body shows the evidence: the same experiments re-run on the patched code, with order failures dropping from 13 of 20 to 0 of 20 and every other experiment at 0 of 20; the repro failed 3 of 3 before and passed 5 of 5 after; 0 failures in 120 runs. Three anti-cheat checks are ticked. Provenance: patch proposed by claude-sonnet-5-5 in a live call, attempt 1 of 3, 2,549 input and 337 output tokens, $0.0095, accepted by the NullCase battery, not by the model. The pull request's CI check passes. Opened on 2026-09-28; time compressed.</desc>

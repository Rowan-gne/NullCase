[project]
name = "nullcase-retrieval"
version = "0.1.0"
description = "Finds existing tests to use as style examples for a target module"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rowan-gne" }]
keywords = ["pytest", "test generation", "import graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Rowan-gne/NullCase"
Repository = "https://github.com/Rowan-gne/NullCase"
Issues = "https://github.com/Rowan-gne/NullCase/issues"
Documentation = "https://github.com/Rowan-gne/NullCase/blob/main/docs/technical-guide.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

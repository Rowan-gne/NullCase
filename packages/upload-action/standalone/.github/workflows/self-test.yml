name: self-test

# Runs this action on real runners against two tiny fixture suites, installing
# nullcase-pytest and nullcase-sandbox from PyPI (the action's defaults).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - id: nullcase
        uses: ./
        with:
          working-directory: self-test
          pytest-args: "-q"

      - name: Check results
        env:
          RESULTS: ${{ steps.nullcase.outputs.results-path }}
        run: python self-test/check_results.py "$RESULTS"

      - id: diagnose
        uses: ./
        with:
          working-directory: self-test-diagnose
          pytest-args: "-q"
          diagnose-tests: test_registry.py::test_first_registration_gets_id_1

      - name: Check diagnosis
        env:
          DIAGNOSES: ${{ steps.diagnose.outputs.diagnoses-path }}
        run: python self-test/check_diagnosis.py "$DIAGNOSES" order_dependent
